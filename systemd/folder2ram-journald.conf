# openmediavault only: /etc/systemd/system/folder2ram_startup.service.d/journald.conf
# folder2ram mounts /var/log in RAM after journald has opened its files, so the
# journal silently stops recording after boot. Reopen it once the mount exists.
[Service]
ExecStartPost=/bin/systemctl --no-block restart systemd-journald.service
